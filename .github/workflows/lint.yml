name: Linting

on:
  push:
    branches: [ main, contanarized-repo ]
  pull_request:
    branches: [ main, contanarized-repo ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .
