service:
  host: 0.0.0.0
  port: 8000
  warm_load: true
  auth_token: change-me
  temp_dir: .rtm_service_tmp

semantic:
  backend: multimodal_vlm
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  local_model_path: /models/qwen2.5-vl-7b-instruct
  device: cuda
  offline: true
  strict: true
  frame_context_radius: 1

action_backend:
  backend: none

azure:
  account_url: https://your-account.blob.core.windows.net
  connection_string: null
  source_container_allowlist:
    - media
  annotation_container: datablob-annotations
  annotation_prefix: annotations
  create_containers: false
