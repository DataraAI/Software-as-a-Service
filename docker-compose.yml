# Run Data-as-a-Service first (see Data-as-a-Service/docker/docker-compose.dev.yml) so the
# ``datara-network`` bridge exists. Then:
#   docker compose up -d --build
# Exec into the saas container or override ``command`` to run your scripts.
#
# Backend DNS name is ``backend`` (Flask dev listens on container port 5000).

services:
  saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datara-saas
    environment:
      DATARA_API_BASE_URL: http://backend:5000
    working_dir: /app
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    networks:
      - datara-network
    command: ["sleep", "infinity"]

networks:
  datara-network:
    external: true
