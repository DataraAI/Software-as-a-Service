version: "3.8"

services:
  saas-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile-saas
      target: production
    container_name: datara-saas-gpu
    ports:
      - "8765:8765"
    environment:
      GPU_API_KEY: ${GPU_API_KEY:-}
      GPU_JOB_TIMEOUT_S: ${GPU_JOB_TIMEOUT_S:-7200}
      DATARA_EGO_IMAGES_ROOT: ${DATARA_EGO_IMAGES_ROOT:-/tmp/datara_ego_outputs}
    gpus: all
    restart: unless-stopped
